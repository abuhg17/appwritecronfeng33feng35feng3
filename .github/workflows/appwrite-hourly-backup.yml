name: Hourly Appwrite Sync

on:
  schedule:
    # GitHub Actions cron is UTC. Minute 33 & 37 each hour.
    - cron: "33 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - external-hourly-sync

concurrency:
  group: appwrite-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export Appwrite data
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          # Skip git-churn when DB content is identical (ignores exportedAt).
          APPWRITE_SKIP_IF_UNCHANGED: "1"
          # Keep newest N history snapshots (~7 days of hourly). 0 = unlimited.
          APPWRITE_HISTORY_RETENTION: "168"
          APPWRITE_EXPORT_DEBUG: "1"
        run: python scripts/fetch_appwrite_backup.py

      - name: Commit updated backup files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- data/appwrite)" ]; then
            echo "No backup changes detected."
            exit 0
          fi

          git add data/appwrite
          git commit -m "chore: update appwrite backup"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
